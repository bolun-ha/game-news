<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日简报 · DAILY BRIEF</title>
<meta name="description" content="由 AI 每日汇编的新闻简报：标题、正文、图片，一览今日要闻。">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ============================================================
   设计令牌
   ============================================================ */
:root{
  --paper:#fbfaf6;
  --paper-2:#f4f2ec;
  --ink:#16150f;
  --ink-2:#403c33;
  --muted:#8b8578;
  --line:#e3ddd0;
  --line-2:#efeae0;
  --accent:#b8352a;
  --accent-2:#8e2319;
  --accent-soft:#f6e9e5;
  --shadow:0 1px 2px rgba(22,21,15,.04), 0 12px 32px -18px rgba(22,21,15,.28);
  --serif:"Noto Serif SC","Songti SC","STSong",'Source Han Serif SC',serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --r:3px;
}
[data-theme="dark"]{
  --paper:#131210;
  --paper-2:#1b1a17;
  --ink:#f1eee6;
  --ink-2:#c9c4b7;
  --muted:#8e8879;
  --line:#2c2a24;
  --line-2:#23221d;
  --accent:#e06450;
  --accent-2:#f08a76;
  --accent-soft:#2a1f1b;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--accent);color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.eyebrow{
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);font-weight:700;
}

/* ============================================================
   顶部栏
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:100;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar .wrap{display:flex;align-items:center;gap:22px;height:64px}
.brand{display:flex;align-items:baseline;gap:9px;flex:0 0 auto}
.brand .mark{
  width:9px;height:9px;background:var(--accent);display:block;
  margin-bottom:2px;
}
.brand .cn{
  font-family:var(--serif);font-weight:900;font-size:22px;letter-spacing:.06em;
  line-height:1;
}
.brand .en{
  font-size:10px;letter-spacing:.24em;color:var(--muted);font-weight:500;
}
.nav{display:flex;gap:2px;flex:0 0 auto}
.nav a{
  padding:7px 12px;border-radius:var(--r);font-size:13px;color:var(--ink-2);
  transition:background .18s ease,color .18s ease;white-space:nowrap;
}
.nav a:hover{background:var(--paper-2);color:var(--ink)}
.nav a[aria-current="page"]{color:var(--accent);font-weight:600}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.search{
  display:flex;align-items:center;gap:8px;
  border:1px solid var(--line);border-radius:99px;padding:6px 13px;
  background:var(--paper-2);transition:border-color .18s,background .18s;
  width:210px;
}
.search:focus-within{border-color:var(--accent);background:var(--paper)}
.search svg{width:14px;height:14px;flex:0 0 auto;stroke:var(--muted)}
.search input{
  border:0;background:transparent;outline:none;font-size:13px;width:100%;
}
.search input::placeholder{color:var(--muted)}
.icon-btn{
  width:34px;height:34px;display:grid;place-items:center;border-radius:50%;
  border:1px solid var(--line);background:var(--paper-2);cursor:pointer;
  transition:border-color .18s,transform .18s,background .18s;
}
.icon-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.icon-btn svg{width:15px;height:15px}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 16px;border-radius:99px;border:1px solid var(--ink);
  background:var(--ink);color:var(--paper);font-size:13px;font-weight:500;
  cursor:pointer;transition:transform .18s,opacity .18s,background .18s;
  white-space:nowrap;
}
.btn:hover{transform:translateY(-1px);opacity:.9}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);opacity:1}
.btn.small{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* ============================================================
   报头 / 日期条
   ============================================================ */
.masthead{padding:38px 0 26px}
.masthead .row{display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap}
.masthead h1{
  margin:0;font-family:var(--serif);font-weight:900;
  font-size:clamp(34px,5vw,54px);letter-spacing:.03em;line-height:1.02;
}
.masthead .meta{
  font-size:12.5px;color:var(--muted);line-height:1.9;
  border-left:2px solid var(--accent);padding-left:14px;
  margin-bottom:4px;
}
.masthead .meta b{color:var(--ink);font-weight:600;font-family:var(--serif)}
.rule{height:1px;background:var(--line);margin-top:26px}
.rule.double{height:4px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);background:transparent}

/* 分类 + 排序 */
.filterbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px 0;border-bottom:1px solid var(--line-2);
}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  padding:5px 13px;border-radius:99px;border:1px solid var(--line);
  font-size:12.5px;color:var(--ink-2);cursor:pointer;background:transparent;
  transition:all .18s ease;
}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:500}
.seg{display:flex;margin-left:auto;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{
  padding:5px 14px;font-size:12.5px;background:transparent;border:0;cursor:pointer;color:var(--muted);
  transition:all .18s;
}
.seg button[aria-pressed="true"]{background:var(--paper-2);color:var(--ink);font-weight:600}

/* ============================================================
   头条区
   ============================================================ */
.hero{display:grid;grid-template-columns:1.62fr 1fr;gap:0;margin:30px 0 10px}
.hero.solo{grid-template-columns:1fr}
.hero.solo .lead{padding-right:0;border-right:0}
.hero.solo .lead .thumb{aspect-ratio:auto;height:410px}
.hero.solo .lead h2{max-width:26ch}
.lead{padding-right:34px;border-right:1px solid var(--line-2)}
.lead .thumb{aspect-ratio:16/9;overflow:hidden;background:var(--paper-2);margin-bottom:20px}
.lead .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.3,1)}
.lead:hover .thumb img{transform:scale(1.035)}
.lead .tagrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tag{
  font-size:11px;letter-spacing:.1em;font-weight:700;color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
  padding:2px 8px;border-radius:2px;
}
.dot{width:3px;height:3px;border-radius:50%;background:var(--muted)}
.lead h2{
  margin:0 0 12px;font-family:var(--serif);font-weight:700;
  font-size:clamp(24px,2.9vw,34px);line-height:1.32;letter-spacing:.01em;
}
.lead:hover h2{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:var(--accent)}
.lead p{margin:0;color:var(--ink-2);font-size:15.5px;line-height:1.8;max-width:58ch}
.lead .byline{margin-top:14px;font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.side{display:flex;flex-direction:column;gap:0;padding-left:34px}
.side .head{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:11px;border-bottom:2px solid var(--ink);margin-bottom:4px;
}
.side .head span{font-family:var(--serif);font-weight:700;font-size:14px;letter-spacing:.08em}
.mini{
  display:grid;grid-template-columns:64px 1fr;gap:13px;
  padding:15px 0;border-bottom:1px solid var(--line-2);
  transition:opacity .2s;
}
.mini:hover{opacity:.78}
.mini .t{aspect-ratio:1;overflow:hidden;background:var(--paper-2)}
.mini .t img{width:100%;height:100%;object-fit:cover}
.mini .txt .cat{font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.06em}
.mini .txt h3{
  margin:4px 0 0;font-family:var(--serif);font-size:15.5px;font-weight:600;
  line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.mini .txt time{display:block;margin-top:6px;font-size:11.5px;color:var(--muted)}
.side-note{margin-top:24px;padding-top:16px;border-top:1px solid var(--line-2)}
.side-note .hd{font-family:var(--serif);font-size:12.5px;font-weight:700;letter-spacing:.1em;margin-bottom:8px}
.side-note p{font-size:12.5px;line-height:1.9;color:var(--muted);margin:0 0 10px}
.side-note a{font-size:12px;color:var(--accent);font-weight:600}

/* ============================================================
   新闻网格
   ============================================================ */
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:18px;margin:52px 0 22px;padding-bottom:12px;
  border-bottom:1px solid var(--line);
}
.section-head h2{
  margin:0;font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:.04em;
  display:flex;align-items:center;gap:11px;
}
.section-head h2::before{content:"";width:4px;height:18px;background:var(--accent);display:block}
.section-head .count{font-size:12px;color:var(--muted);letter-spacing:.05em}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:34px 28px}
.card{display:flex;flex-direction:column;transition:transform .25s ease}
.card:hover{transform:translateY(-3px)}
.card .thumb{aspect-ratio:16/10;overflow:hidden;background:var(--paper-2);margin-bottom:14px;border-radius:var(--r)}
.card .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.3,1)}
.card:hover .thumb img{transform:scale(1.04)}
.card .tagrow{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.card .cat{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.card time{font-size:11.5px;color:var(--muted)}
.card h3{
  margin:0 0 8px;font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card p{
  margin:0;font-size:13.5px;line-height:1.72;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

/* 无图占位 */
.ph{
  display:grid;place-items:center;width:100%;height:100%;
  background:
    repeating-linear-gradient(45deg, transparent 0 9px, color-mix(in srgb,var(--ink) 4%, transparent) 9px 10px),
    var(--paper-2);
  color:var(--ink-2);font-family:var(--serif);font-size:12px;letter-spacing:.28em;opacity:.65;
}

/* 更多报道 */
.more{margin-top:56px}
.more-list{border-top:1px solid var(--line-2)}
.row{
  display:grid;grid-template-columns:44px 1fr auto;gap:18px;align-items:baseline;
  padding:17px 0;border-bottom:1px solid var(--line-2);transition:background .18s,padding-left .18s;
}
.row:hover{background:var(--paper-2);padding-left:10px}
.row .num{font-family:var(--serif);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .body h4{
  margin:0 0 5px;font-family:var(--serif);font-size:16.5px;font-weight:600;line-height:1.55;
}
.row .body .m{font-size:11.5px;color:var(--muted);display:flex;gap:9px;align-items:center}
.row .go{font-size:11px;color:var(--muted);letter-spacing:.1em}

/* 空状态 */
.empty{
  padding:80px 0;text-align:center;color:var(--muted);
}
.empty h3{font-family:var(--serif);color:var(--ink);font-size:20px;margin:0 0 8px}

/* ============================================================
   文章页
   ============================================================ */
.article{padding:30px 0 20px;max-width:820px;margin:0 auto}
.crumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:22px}
.crumb a:hover{color:var(--accent)}
.article .tagrow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.article h1{
  margin:0 0 18px;font-family:var(--serif);font-weight:900;
  font-size:clamp(26px,4.2vw,42px);line-height:1.28;letter-spacing:.005em;
}
.article .deck{
  font-size:17px;line-height:1.85;color:var(--ink-2);
  padding:16px 0 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  margin-bottom:20px;
}
.byline{
  display:flex;flex-wrap:wrap;align-items:center;gap:14px;
  font-size:12px;color:var(--muted);margin-bottom:26px;
}
.byline b{color:var(--ink);font-weight:600}
.byline .sep{width:1px;height:12px;background:var(--line)}
.cover{margin:0 0 30px}
.cover img{width:100%;max-height:440px;object-fit:cover;border-radius:var(--r)}
.cover figcaption{font-size:12px;color:var(--muted);margin-top:9px;text-align:center}
.prose{font-family:var(--serif);font-size:17.5px;line-height:1.95;color:var(--ink);letter-spacing:.01em}
.prose p{margin:0 0 1.35em}
.prose p:first-child::first-letter{
  float:left;font-size:3.15em;line-height:.86;padding:.06em .12em 0 0;
  font-weight:700;color:var(--accent);
}
.prose h2{
  font-size:20px;font-weight:700;margin:2.1em 0 .75em;line-height:1.5;
  padding-left:13px;border-left:3px solid var(--accent);
}
.prose h3{font-size:17.5px;font-weight:700;margin:1.7em 0 .6em}
.prose blockquote{
  margin:1.8em 0;padding:2px 0 2px 22px;border-left:2px solid var(--line);
  color:var(--ink-2);font-size:16.5px;font-style:normal;
}
.prose blockquote cite{display:block;margin-top:10px;font-size:13px;color:var(--muted);font-style:normal;font-family:var(--sans)}
.prose ul,.prose ol{margin:0 0 1.35em;padding-left:1.4em}
.prose li{margin-bottom:.5em}
.prose img{border-radius:var(--r);margin:1.6em 0}
.prose figure{margin:1.8em 0}
.prose figure img{margin:0}
.prose figcaption{font-size:12.5px;color:var(--muted);text-align:center;margin-top:9px;font-family:var(--sans)}
.prose hr{border:0;border-top:1px solid var(--line);margin:2.4em 0}
.prose code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;background:var(--paper-2);padding:.12em .4em;border-radius:2px}
.prose a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}

.tags{display:flex;gap:7px;flex-wrap:wrap;margin:36px 0 0;padding-top:24px;border-top:1px solid var(--line)}
.tags .t{font-size:12px;padding:4px 11px;border:1px solid var(--line);border-radius:99px;color:var(--ink-2)}
.srcbox{
  margin-top:26px;padding:18px 20px;background:var(--paper-2);border-radius:var(--r);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  border:1px solid var(--line-2);
}
.srcbox .k{font-size:12px;color:var(--muted)}
.srcbox .v{font-size:13px;font-weight:600;margin-right:auto}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:46px 0 0}
.pager a{
  padding:18px 20px;border:1px solid var(--line);border-radius:var(--r);
  transition:border-color .18s,background .18s;
}
.pager a:hover{border-color:var(--ink);background:var(--paper-2)}
.pager .k{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.pager h4{margin:6px 0 0;font-family:var(--serif);font-size:15px;font-weight:600;line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pager a:last-child{text-align:right}

/* ============================================================
   编辑器
   ============================================================ */
.panel{padding:36px 0 70px}
.panel-head{margin-bottom:26px}
.panel-head h1{font-family:var(--serif);font-size:30px;font-weight:700;margin:0 0 8px}
.panel-head p{margin:0;color:var(--muted);font-size:13.5px;max-width:70ch;line-height:1.8}
.editor-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:start}
.form{display:flex;flex-direction:column;gap:15px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px;letter-spacing:.04em}
.field label .req{color:var(--accent);margin-left:3px}
.field input, .field select, .field textarea{
  width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--paper);outline:none;font-size:13.5px;transition:border-color .18s,box-shadow .18s;
}
.field textarea{resize:vertical;min-height:230px;line-height:1.75;font-family:ui-monospace,Menlo,Consolas,"Noto Sans SC",monospace;font-size:13px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

.preview-col{position:sticky;top:88px}
.preview-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.preview-label span{font-size:11px;letter-spacing:.16em;color:var(--muted)}
.preview-box{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--paper)}
.preview-box .inner{padding:0}
.preview-empty{padding:56px 20px;text-align:center;color:var(--muted);font-size:13px}

.json-out{margin-top:20px}
.json-out .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.json-out .bar span{font-size:11px;letter-spacing:.16em;color:var(--muted)}
pre.code{
  margin:0;padding:16px;background:var(--paper-2);border:1px solid var(--line);
  border-radius:var(--r);font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:12px;line-height:1.7;overflow:auto;max-height:340px;white-space:pre-wrap;word-break:break-all;
}

/* ============================================================
   接入说明
   ============================================================ */
.doc{max-width:840px;margin:0 auto;padding:34px 0 80px}
.doc h1{font-family:var(--serif);font-size:32px;font-weight:700;margin:0 0 10px}
.doc .lead-p{color:var(--muted);font-size:14px;line-height:1.85;margin:0 0 34px}
.doc h2{
  font-family:var(--serif);font-size:18px;font-weight:700;margin:38px 0 12px;
  padding-left:12px;border-left:3px solid var(--accent);
}
.doc p{font-size:14px;line-height:1.9;color:var(--ink-2);margin:0 0 12px}
.doc ul, .doc ol{font-size:14px;line-height:1.9;color:var(--ink-2);padding-left:1.4em;margin:0 0 14px}
.doc code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--paper-2);padding:.12em .4em;border-radius:2px}
.doc table{width:100%;border-collapse:collapse;margin:14px 0 18px;font-size:13px}
.doc th, .doc td{border-bottom:1px solid var(--line-2);padding:9px 10px;text-align:left;vertical-align:top}
.doc th{font-size:11.5px;letter-spacing:.08em;color:var(--muted);font-weight:600;background:var(--paper-2)}
.doc td code{background:transparent;padding:0;color:var(--accent);font-size:12px}
.copybar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 4px;
}
.copybar span{font-size:11px;letter-spacing:.14em;color:var(--muted)}

/* ============================================================
   页脚
   ============================================================ */
footer{
  border-top:1px solid var(--line);margin-top:70px;padding:36px 0 48px;
  font-size:12px;color:var(--muted);
}
footer .wrap{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
footer .f-brand{font-family:var(--serif);font-weight:700;color:var(--ink);font-size:15px;letter-spacing:.05em}
footer .f-links{display:flex;gap:16px;flex-wrap:wrap}
footer a:hover{color:var(--accent)}

    "content": "上周的一场技术沟通会上，一家做企业知识库的团队展示了一个细节：当用户隔了三周回到同一个对话里提问，系统先调出的不是检索结果，而是一段关于「上次你关心的是华东区的产能」的摘要。\n\n这个变化看起来微小，却是过去半年里最实在的一次转向——**从「读得多」到「记得久」。**\n\n## 三种不同的记忆\n\n目前行业里被讨论的记忆方案，大致可以分成三层：\n\n- **会话内记忆**：一次对话里的上下文窗口，靠长上下文硬撑，成本随长度线性上升。\n- **结构化记忆**：把用户偏好、事实结论抽成字段存进数据库，用时再拼进提示词。\n- **经验记忆**：记录「上次这么做失败了」，让智能体在同类任务上少走弯路。\n\n前两种已经被大量产品采用，第三种目前还停留在少数团队的内部实验里。\n\n> 「长上下文解决的是读的问题，记忆解决的是认的问题。前者是能力，后者才是关系。」\n> —— 一位不愿具名的应用层产品负责人\n\n## 成本账才是分水岭\n\n把所有历史都塞进上下文，最直接的问题是账单。一位基础设施工程师给出的经验值是：当单次请求的上下文超过 40 万 token，推理成本会进入一个很难受的区间，而这部分开销往往换不来等比例的回答质量提升。\n\n于是「摘要 + 检索 + 少量精读」的混合策略成了主流：先用便宜的方式筛，再用贵的方式读。\n\n## 还没解决的两件事\n\n一是**遗忘的权利**。用户要求删除某段记录时，散落在多处的摘要和索引是否被真正清掉，目前很少有产品敢给出明确答复。\n\n二是**记忆的可解释性**。当模型说「根据你之前的偏好」，用户往往无从核查它到底记住了什么。\n\n这两件事，比起能不能记住，更接近这个方向真正的天花板。"

<script>
(function () {
  "use strict";

  /* ---------------- 工具函数 ---------------- */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const esc = (s) => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  const WEEK = ["日", "一", "二", "三", "四", "五", "六"];

  function parseDate(d) {
    if (!d) return null;
    if (d instanceof Date) return d;
    let s = String(d).trim();
    // 兼容 "2026-11-23 09:10" / "2026/11/23" / 纯日期
    if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)) s += "T00:00:00+08:00";
    s = s.replace(/^(\d{4})\/(\d{1,2})\/(\d{1,2})/, "$1-$2-$3").replace(" ", "T");
    const t = new Date(s);
    return isNaN(t.getTime()) ? null : t;
  }
  function fmtDate(d, withTime) {
    const t = parseDate(d);
    if (!t) return "";
    const s = (t.getMonth() + 1) + "月" + t.getDate() + "日";
    if (!withTime) return s;
    const hh = String(t.getHours()).padStart(2, "0");
    const mm = String(t.getMinutes()).padStart(2, "0");
    return s + " " + hh + ":" + mm;
  }
  function fmtFull(d) {
    const t = parseDate(d);
    if (!t) return "";
    return t.getFullYear() + "年" + (t.getMonth() + 1) + "月" + t.getDate() + "日 · 星期" + WEEK[t.getDay()];
  }
  function relTime(d) {
    const t = parseDate(d);
    if (!t) return "";
    const diff = Date.now() - t.getTime();
    const m = Math.floor(diff / 60000);
    if (m < 1) return "刚刚";
    if (m < 60) return m + " 分钟前";
    const h = Math.floor(m / 60);
    if (h < 24) return h + " 小时前";
    const dd = Math.floor(h / 24);
    if (dd < 7) return dd + " 天前";
    return fmtDate(d);
  }
  const safeUrl = (u) => {
    const s = String(u || "").trim();
    if (!s) return "";
    if (/^(javascript|data):/i.test(s)) return "";
    return s;
  };

  /* ---------------- Markdown → HTML ---------------- */
  function inlineMd(text) {
    let t = esc(text);
    // 行内代码先占位，避免内部被其它规则干扰
    const codes = [];
    t = t.replace(/`([^`]+)`/g, (m, c) => {
      codes.push(c);
      return "\u0000C" + (codes.length - 1) + "\u0000";
    });
    // 链接 [文字](url)
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, href) => {
      const u = safeUrl(href.replace(/&amp;/g, "&"));
      if (!u) return label;
      return '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + label + "</a>";
    });
    // 粗体 / 斜体
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
    // 还原行内代码
    t = t.replace(/\u0000C(\d+)\u0000/g, (m, i) => "<code>" + codes[+i] + "</code>");
    // 中文之间的空格清理
    t = t.replace(/(?<=[\u4e00-\u9fa5，。、；：！？“”（）])\s+(?=[\u4e00-\u9fa5，。、；：！？“”（）])/g, "");
    return t;
  }

  const isBlockStart = (l) =>
    /^(#{2,4})\s+/.test(l) || /^---+$/.test(l) || /^!\[/.test(l) ||
    /^>\s?/.test(l) || /^[-*]\s+/.test(l) || /^\d+[.、)]\s+/.test(l) ||
    /^\|/.test(l);

  function mdToHtml(md) {
    const lines = String(md || "").replace(/\r\n?/g, "\n").split("\n");
    let out = [], i = 0;

    while (i < lines.length) {
      const raw = lines[i];
      const t = raw.trim();

      if (!t) { i++; continue; }

      // 标题
      let m = t.match(/^(#{2,4})\s+(.*)$/);
      if (m) {
        const lv = m[1].length;
        out.push("<h" + lv + ">" + inlineMd(m[2]) + "</h" + lv + ">");
        i++; continue;
      }
      // 分隔线
      if (/^---+$/.test(t)) { out.push("<hr>"); i++; continue; }

      // 独立成行的图片
      m = t.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
      if (m) {
        const src = safeUrl(m[2]);
        if (src) {
          out.push('<figure><img src="' + esc(src) + '" alt="' + esc(m[1] || "") +
            '" loading="lazy">' + (m[1] ? "<figcaption>" + esc(m[1]) + "</figcaption>" : "") + "</figure>");
        }
        i++; continue;
      }

      // 引用
      if (/^>\s?/.test(t)) {
        const buf = [];
        while (i < lines.length && /^>\s?/.test(lines[i].trim())) {
          buf.push(inlineMd(lines[i].trim().replace(/^>\s?/, "")));
          i++;
        }
        let q = buf.join("<br>");
        // 最后一行若是 —— 出处，转成 cite
        const citeMatch = buf.length > 1 && /^——\s?/.test(lines[i - 1].trim().replace(/^>\s?/, ""));
        if (citeMatch) {
          const last = buf.pop();
          q = buf.join("<br>") + "<cite>" + last.replace(/^——\s?/, "—— ") + "</cite>";
        }
        out.push("<blockquote>" + q + "</blockquote>");
        continue;
      }

      // 无序列表
      if (/^[-*]\s+/.test(t)) {
        const items = [];
        while (i < lines.length && /^[-*]\s+/.test(lines[i].trim())) {
          items.push("<li>" + inlineMd(lines[i].trim().replace(/^[-*]\s+/, "")) + "</li>");
          i++;
        }
        out.push("<ul>" + items.join("") + "</ul>");
        continue;
      }

      // 有序列表
      if (/^\d+[.、)]\s+/.test(t)) {
        const items = [];
        while (i < lines.length && /^\d+[.、)]\s+/.test(lines[i].trim())) {
          items.push("<li>" + inlineMd(lines[i].trim().replace(/^\d+[.、)]\s+/, "")) + "</li>");
          i++;
        }
        out.push("<ol>" + items.join("") + "</ol>");
        continue;
      }

      // 表格
      if (/^\|/.test(t)) {
        const rows = [];
        while (i < lines.length && /^\|/.test(lines[i].trim())) {
          rows.push(lines[i].trim()); i++;
        }
        const cells = (r) => r.replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
        const head = cells(rows[0]);
        const sepIdx = rows[1] && /^[\s|:-]+$/.test(rows[1]) ? 1 : 0;
        let html = "<table><thead><tr>" + head.map((c) => "<th>" + inlineMd(c) + "</th>").join("") + "</tr></thead><tbody>";
        for (let r = 1 + sepIdx; r < rows.length; r++) {
          html += "<tr>" + cells(rows[r]).map((c) => "<td>" + inlineMd(c) + "</td>").join("") + "</tr>";
        }
        html += "</tbody></table>";
        out.push(html);
        continue;
      }

      // 段落
      const buf = [];
      while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i].trim())) {
        buf.push(lines[i].trim()); i++;
      }
      if (buf.length) out.push("<p>" + inlineMd(buf.join(" ")) + "</p>");
      else { i++; } // 保险：避免死循环
    }
    return out.join("\n");
  }

  /* ---------------- 数据加载与合并 ---------------- */
  function readJsonBlock(id, fallback) {
    const el = document.getElementById(id);
    if (!el) return fallback;
    try {
      return JSON.parse(el.textContent);
    } catch (e) {
      console.error("[" + id + "] JSON 解析失败：", e);
      window.__dataError = (window.__dataError || "") + id + "：" + e.message + "\n";
      return fallback;
    }
  }

  let SITE = readJsonBlock("site-config", {}) || {};
  const BASE = readJsonBlock("news-data", []) || [];

  const LOCAL_KEY = "brief.drafts.v1";
  function readLocal() {
    try { const s = JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); return Array.isArray(s) ? s : []; }
    catch (e) { return []; }
  }
  function writeLocal(arr) {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(arr)); } catch (e) { }
  }
  function readFav() {
    try { return JSON.parse(localStorage.getItem("brief.fav.v1") || "[]"); } catch (e) { return []; }
  }

  let DATA = [];
  let dataError = window.__dataError || "";

  /* 规范化 + 去重合并 */
  function normalize(raw, idx) {
    const o = Object.assign({}, raw);
    o.id = String(o.id || ("auto-" + idx + "-" + (o.title || "").slice(0, 8)));
    o.title = String(o.title || "（无标题）");
    o.summary = String(o.summary || o.deck || "");
    o.category = String(o.category || "未分类");
    o.date = o.date || "";
    o.author = o.author || "";
    o.source = o.source || "";
    o.sourceUrl = safeUrl(o.sourceUrl);
    o.cover = safeUrl(o.cover);
    o.content = String(o.content || o.body || "");
    o.tags = Array.isArray(o.tags) ? o.tags.map(String) : (o.tags ? String(o.tags).split(/[,，]/).map(s => s.trim()).filter(Boolean) : []);
    o.featured = !!o.featured;
    o._ts = parseDate(o.date) ? parseDate(o.date).getTime() : 0;
    return o;
  }

  function buildData(extra) {
    const all = BASE.concat(extra || []).concat(readLocal());
    const map = new Map();
    all.forEach((it, i) => {
      if (!it || typeof it !== "object") return;
      const n = normalize(it, i);
      map.set(n.id, n);  // 后出现的覆盖前面的：远程 > 本地草稿的优先级由顺序决定
    });
    return Array.from(map.values()).sort((a, b) => b._ts - a._ts);
  }

  DATA = buildData();

  // 远程数据源（可选）：?src=<json 地址> 或 site-config.remoteSources
  function loadRemote() {
    const q = new URLSearchParams(location.search).get("src");
    const urls = [].concat(q ? [q] : []).concat(SITE.remoteSources || []);
    if (!urls.length) return;
    urls.forEach((u) => {
      fetch(u, { mode: "cors" }).then((r) => r.json()).then((json) => {
        const items = Array.isArray(json) ? json : (json.items || []);
        if (items.length) { DATA = mergeData(items); render(); }
      }).catch((e) => console.warn("远程数据源加载失败：" + u, e));
    });
  }
  function mergeData(items) {
    const map = new Map(DATA.map((d) => [d.id, d]));
    items.forEach((it, i) => { const n = normalize(it, i); if (n.id) map.set(n.id, n); });
    return Array.from(map.values()).sort((a, b) => b._ts - a._ts);
  }

  /* ---------------- 视图：通用片段 ---------------- */
  const hrefOf = (it) => "#/n/" + encodeURIComponent(it.id);

  function thumb(it, cls) {
    if (it.cover) {
      return '<img src="' + esc(it.cover) + '" alt="' + esc(it.title) + '" loading="lazy" ' +
        'onerror="this.style.display=\'none\';this.parentNode.classList.add(\'ph\');this.parentNode.textContent=\'' + esc(it.category).replace(/'/g, "\\'") + '\'">';
    }
    return '<span class="ph">' + esc(it.category) + "</span>";
  }

  function cats() {
    const fromData = Array.from(new Set(DATA.map((d) => d.category))).filter(Boolean);
    const order = (SITE.categories || []);
    const merged = [];
    order.forEach((c) => { if (fromData.includes(c)) merged.push(c); });
    fromData.forEach((c) => { if (!merged.includes(c)) merged.push(c); });
    return merged;
  }

  /* ---------------- 视图：首页 ---------------- */
  let UI = { q: "", cat: "全部", sort: "new" };

  function matchQ(it) {
    const q = UI.q.trim().toLowerCase();
    if (!q) return true;
    const hay = (it.title + " " + it.summary + " " + it.category + " " + (it.tags || []).join(" ") + " " + it.content).toLowerCase();
    return hay.includes(q);
  }

  function renderHome() {
    const issues = [];
    if (!DATA.length) {
      return '<div class="wrap"><div class="empty"><h3>还没有新闻</h3>' +
        '<p>打开 <code>#/write</code> 投递第一条，或让 Agent 把新闻追加进 <code>news-data</code>。</p></div></div>';
    }

    const all = DATA.filter(matchQ);
    const filtered = UI.cat === "全部" ? all : all.filter((it) => it.category === UI.cat);
    const sorted = filtered.slice().sort((a, b) =>
      UI.sort === "new" ? b._ts - a._ts : (b.featured - a.featured) || (b._ts - a._ts)
    );

    if (!sorted.length) {
      return masthead() + filterbar() +
        '<div class="wrap"><div class="empty"><h3>没有匹配的新闻</h3>' +
        '<p>换个关键词，或点「全部」分类试试。</p></div></div>';
    }

    const lead = sorted.find((it) => it.cover) || sorted[0];
    const rest = sorted.filter((it) => it !== lead);
    const side = rest.slice(0, 3);
    const gridItems = rest.slice(3, 9);
    const moreItems = rest.slice(9, 23);

    let html = masthead() + filterbar();

    html += '<div class="wrap">';

    // 头条
    html += '<section class="hero' + (side.length ? "" : " solo") + '">';
    html += '<a class="lead" href="' + hrefOf(lead) + '">';
    if (lead.cover) html += '<div class="thumb">' + thumb(lead) + "</div>";
    html += '<div class="tagrow"><span class="tag">' + esc(lead.category) + '</span>' +
      '<span style="font-size:11.5px;color:var(--muted)">' + relTime(lead.date) + "</span></div>";
    html += "<h2>" + esc(lead.title) + "</h2>";
    if (lead.summary) html += "<p>" + esc(lead.summary) + "</p>";
    html += '<div class="byline"><span>' + esc(lead.author || lead.source || "编辑部") + "</span><i class=\"dot\"></i><span>" +
      fmtDate(lead.date, true) + "</span></div>";
    html += "</a>";

    if (side.length) {
      html += '<div class="side">';
      html += '<div class="head"><span>要闻速览</span><span style="font-size:11px;color:var(--muted)">' + fmtDate((DATA[0] || {}).date) + "</span></div>";
      side.forEach((it) => {
        html += '<a class="mini" href="' + hrefOf(it) + '">';
        html += '<div class="t">' + (it.cover ? '<img src="' + esc(it.cover) + '" alt="" loading="lazy" onerror="this.parentNode.classList.add(\'ph\')">' : '<span class="ph"></span>') + "</div>";
        html += '<div class="txt"><span class="cat">' + esc(it.category) + "</span>" +
          "<h3>" + esc(it.title) + "</h3><time>" + relTime(it.date) + "</time></div>";
        html += "</a>";
      });
      html += '<div class="side-note"><div class="hd">关于本站</div>' +
        "<p>每日由 AI 汇编、人工复核。所有报道存放在本页的 <code>news-data</code> 数据块里，任何 Agent 只要会改这段 JSON，就能往站里投递新闻。</p>" +
        '<a href="#/guide">查看接入说明 →</a></div>';
      html += "</div>";
    }
    html += "</section>";

    // 网格
    if (gridItems.length) {
      html += '<div class="section-head"><h2>最新报道</h2><span class="count">共 ' + sorted.length + " 篇</span></div>";
      html += '<div class="grid">';
      gridItems.forEach((it) => {
        html += '<a class="card" href="' + hrefOf(it) + '">';
        html += '<div class="thumb">' + thumb(it) + "</div>";
        html += '<div class="tagrow"><span class="cat">' + esc(it.category) + "</span><time>" + fmtDate(it.date, true) + "</time></div>";
        html += "<h3>" + esc(it.title) + "</h3>";
        if (it.summary) html += "<p>" + esc(it.summary) + "</p>";
        html += "</a>";
      });
      html += "</div>";
    }

    // 更多
    if (moreItems.length) {
      html += '<section class="more"><div class="section-head"><h2>更多报道</h2></div><div class="more-list">';
      moreItems.forEach((it, i) => {
        html += '<a class="row" href="' + hrefOf(it) + '">';
        html += '<span class="num">' + String(i + 1).padStart(2, "0") + "</span>";
        html += '<div class="body"><h4>' + esc(it.title) + "</h4>" +
          '<div class="m"><span>' + esc(it.category) + "</span><i class=\"dot\"></i><span>" + fmtDate(it.date, true) + "</span></div></div>";
        html += '<span class="go">阅读 →</span>';
        html += "</a>";
      });
      html += "</div></section>";
    }

    html += "</div>";
    return html;
  }

  function masthead() {
    const newest = DATA[0] ? DATA[0].date : "";
    const d = fmtFull(newest);
    return '<div class="wrap"><div class="masthead"><div class="row">' +
      "<h1>" + esc(SITE.siteName || "每日简报") + "</h1>" +
      '<div class="meta"><b>' + esc(d || "今日") + "</b><br>" +
      esc(SITE.issue || "") + " · 共 " + DATA.length + " 篇 · 由 AI 汇编</div>" +
      "</div></div>" +
      (dataError ? '<div style="background:var(--accent-soft);border-left:3px solid var(--accent);padding:12px 16px;margin:0 0 8px;font-size:12.5px;color:var(--accent-2)">数据格式有误，已跳过该块：' + esc(dataError.slice(0, 200)) + "</div>" : "") +
      '<div class="rule double" style="margin-top:0;margin-bottom:0"></div>';
  }

  function filterbar() {
    const list = ["全部"].concat(cats());
    let h = '<div class="filterbar"><div class="chips">';
    list.forEach((c) => {
      h += '<button class="chip" data-cat="' + esc(c) + '" aria-pressed="' + (UI.cat === c) + '">' + esc(c) + "</button>";
    });
    h += "</div>";
    h += '<div class="seg">' +
      '<button data-sort="new" aria-pressed="' + (UI.sort === "new") + '">最新</button>' +
      '<button data-sort="hot" aria-pressed="' + (UI.sort === "hot") + '">要闻</button>' +
      "</div></div></div>";
    return h;
  }

  /* ---------------- 视图：文章页 ---------------- */
  function renderArticle(id) {
    const it = DATA.find((d) => d.id === id);
    if (!it) {
      return '<div class="wrap"><div class="empty"><h3>找不到这篇报道</h3>' +
        '<p>它可能已被移除，或链接里的 id 不一致。</p><p><a href="#/" style="color:var(--accent)">← 回到首页</a></p></div></div>';
    }
    const idx = DATA.findIndex((d) => d.id === id);
    const prev = DATA[idx + 1], next = DATA[idx - 1];

    let h = '<div class="wrap"><article class="article">';
    h += '<div class="crumb"><a href="#/">要闻</a><span>/</span><a href="#/">' + esc(it.category) + "</a></div>";
    h += '<div class="tagrow"><span class="tag">' + esc(it.category) + "</span>" +
      (it.featured ? '<span style="font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.1em">头条</span>' : "") + "</div>";
    h += "<h1>" + esc(it.title) + "</h1>";
    if (it.summary) h += '<p class="deck">' + esc(it.summary) + "</p>";

    h += '<div class="byline">';
    h += "<span><b>" + esc(it.author || "编辑部") + "</b></span><i class=\"sep\"></i>";
    h += "<span>" + esc(it.date ? fmtDate(it.date, true) : "") + "</span>";
    if (it.source) {
      h += '<i class="sep"></i><span>来源：' + (it.sourceUrl
        ? '<a href="' + esc(it.sourceUrl) + '" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">' + esc(it.source) + "</a>"
        : esc(it.source)) + "</span>";
    }
    h += "</div>";

    if (it.cover) {
      h += '<figure class="cover"><img src="' + esc(it.cover) + '" alt="' + esc(it.title) + '" onerror="this.parentNode.style.display=\'none\'"></figure>';
    }

    h += '<div class="prose">' + mdToHtml(it.content) + "</div>";

    if ((it.tags || []).length) {
      h += '<div class="tags">';
      it.tags.forEach((t) => { h += '<span class="t"># ' + esc(t) + "</span>"; });
      h += "</div>";
    }

    if (it.source || it.sourceUrl) {
      h += '<div class="srcbox"><span class="k">原文出处</span><span class="v">' + esc(it.source || "—") + "</span>";
      if (it.sourceUrl) h += '<a class="btn small" href="' + esc(it.sourceUrl) + '" target="_blank" rel="noopener noreferrer">查看原文 ↗</a>';
      h += "</div>";
    }

    h += '<div class="pager">';
    h += prev ? '<a href="' + hrefOf(prev) + '"><div class="k">← 更早</div><h4>' + esc(prev.title) + "</h4></a>" : "<span></span>";
    h += next ? '<a href="' + hrefOf(next) + '"><div class="k">更新 →</div><h4>' + esc(next.title) + "</h4></a>" : "<span></span>";
    h += "</div>";

    h += "</article></div>";
    return h;
  }

  /* ---------------- 视图：编辑器 ---------------- */
  const EMPTY_FORM = { id: "", title: "", summary: "", category: "", date: "", author: "", source: "", sourceUrl: "", cover: "", tags: "", content: "", featured: false };

  function todayISO() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function renderEditor() {

    let h = '<div class="wrap"><div class="panel">';
    h += '<div class="panel-head"><h1>投递新闻</h1>' +
      "<p>填完左边表单，右边实时预览。点「生成 JSON」后，把结果追加到 <code>news-data</code> 数据块，或先存成本地草稿立即在本页看到效果。</p></div>";

    h += '<div class="editor-grid">';

    /* 表单 */
    h += '<div class="form">';

    h += field("summary", "摘要（导语）", '<textarea id="f-summary" rows="3" style="min-height:78px;font-family:var(--sans);font-size:13.5px" placeholder="60–90 字，说清发生了什么"></textarea>');

      field("source", "来源", '<input id="f-source" type="text" placeholder="选填，如 简报综合">') +
      "</div>";
    h += field("sourceUrl", "原文链接", '<input id="f-source-url" type="url" placeholder="https://…">');
    h += field("cover", "封面图链接", '<input id="f-cover" type="url" placeholder="https://…/cover.jpg">',
      false, "必须是图片直链（jpg / png / webp），不要贴网页地址。留空则显示分类占位图。");
    h += field("tags", "标签", '<input id="f-tags" type="text" placeholder="用逗号分隔，如 大模型, 芯片">');
    h += field("content", "正文（Markdown）", '<textarea id="f-content" placeholder="空行分段&#10;&#10;## 小标题&#10;&#10;> 引用&#10;&#10;- 列表项&#10;&#10;![图注](图片链接)"></textarea>',
      true, "支持：空行分段 / ## 小标题 / > 引用 / - 列表 / 1. 有序列表 / ![图注](url) / **粗体** / [文字](url) / 表格 / --- 分隔线");
    h += '<label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)">' +
      '<input type="checkbox" id="f-featured" style="width:auto"> 置为头条（首页大图位）</label>';
    h += '<div class="form-actions">' +
      '<button class="btn" id="btn-json">生成 JSON</button>' +
      '<button class="btn ghost" id="btn-local">存为本地草稿</button>' +
      '<button class="btn ghost" id="btn-reset">清空</button>' +
      "</div>";

      "</select></div>";

      h += '<div class="field"><label>本地草稿（' + drafts.length + ' 条，仅本机可见）</label>' +
        '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
        drafts.map((d) => '<button class="chip" data-del="' + esc(d.id) + '">' + esc(d.title.slice(0, 18)) + " ×</button>").join("") +

  function field(name, label, control, req, hint) {
    return '<div class="field"><label for="f-' + name + '">' + label + (req ? '<span class="req">*</span>' : "") + "</label>" +
      control + (hint ? '<div class="hint">' + hint + "</div>" : "") + "</div>";
  }
  function catDatalist() {
    const cs = cats();
    if (!cs.length) return "";
    return '<datalist id="cat-list">' + cs.map((c) => '<option value="' + esc(c) + '">').join("") + "</datalist>";
  }

  function readForm() {
    const v = (id) => { const el = $("#" + id); return el ? el.value.trim() : ""; };
    const obj = {
      id: v("f-id") || "",
      title: v("f-title"),
      summary: v("f-summary"),
      category: v("f-category") || "未分类",
      date: v("f-date") ? (v("f-date").length === 16 ? v("f-date") + ":00+08:00" : v("f-date")) : "",
      author: v("f-author"),
      source: v("f-source"),
      sourceUrl: v("f-source-url"),
      cover: v("f-cover"),
      tags: v("f-tags") ? v("f-tags").split(/[,，]/).map((s) => s.trim()).filter(Boolean) : [],
      featured: ($("#f-featured") || {}).checked || false,
      content: v("f-content")
    };
    if (!obj.id) obj.id = makeId(obj.date);
    return obj;
  }
  function makeId(dateStr) {
    const d = parseDate(dateStr) || new Date();
    const p = (n) => String(n).padStart(2, "0");
    const base = "" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate());
    let n = 1, id = base + "-" + p(n);
    const exists = (x) => DATA.some((d) => d.id === x) || readLocal().some((d) => d.id === x);
    while (exists(id)) { n++; id = base + "-" + p(n); }
    return id;
  }

  function previewHtml(obj) {
    if (!obj.title && !obj.content) return '<div class="preview-empty">在左侧填写标题与正文，这里会实时渲染成阅读页样式。</div>';
    let h = '<article class="article" style="padding:22px 24px 28px">';
    h += '<div class="tagrow"><span class="tag">' + esc(obj.category || "未分类") + "</span></div>";
    h += '<h1 style="font-size:26px;margin-bottom:12px">' + esc(obj.title || "（无标题）") + "</h1>";
    if (obj.summary) h += '<p class="deck" style="font-size:14.5px;padding:10px 0 12px;margin-bottom:14px">' + esc(obj.summary) + "</p>";
    h += '<div class="byline" style="margin-bottom:16px"><span><b>' + esc(obj.author || "编辑部") + "</b></span><i class=\"sep\"></i><span>" +
      esc(obj.date ? fmtDate(obj.date, true) : "") + "</span></div>";
    if (obj.cover && safeUrl(obj.cover)) h += '<figure class="cover" style="margin-bottom:20px"><img src="' + esc(safeUrl(obj.cover)) + '" alt=""></figure>';
    h += '<div class="prose" style="font-size:15px;line-height:1.85">' + mdToHtml(obj.content) + "</div>";
    h += "</article>";
    return h;
  }

  function bindEditor() {
    const update = () => {
      const obj = readForm();
      $("#pv-body").innerHTML = previewHtml(obj);
      $("#pv-meta").textContent = (obj.title.length || 0) + " 字标题 · " + (obj.content.length || 0) + " 字正文";
    };
    ["f-title", "f-summary", "f-category", "f-date", "f-author", "f-source", "f-source-url", "f-cover", "f-tags", "f-content", "f-featured"]
      .forEach((id) => { const el = $("#" + id); if (el) { el.addEventListener("input", update); el.addEventListener("change", update); } });

    $("#btn-json").addEventListener("click", () => {
      const obj = readForm();
      if (!obj.title) { alert("标题不能为空"); return; }
      const clean = Object.assign({}, obj);
      Object.keys(clean).forEach((k) => { if (clean[k] === "" || (Array.isArray(clean[k]) && !clean[k].length) || clean[k] === false) delete clean[k]; });
      const json = JSON.stringify(clean, null, 2);
      $("#json-out").textContent = json;
      const btn = $("#btn-copy-json");
      btn.style.display = "inline-flex";
      btn.onclick = () => copyText(json, btn);
    });

    $("#btn-local").addEventListener("click", () => {
      const obj = readForm();
      if (!obj.title) { alert("标题不能为空"); return; }
      const drafts = readLocal().filter((d) => d.id !== obj.id);
      drafts.push(obj);
      writeLocal(drafts);
      DATA = buildData();
      alert("已存为本地草稿，返回首页即可看到（仅本机浏览器可见）。");
      location.hash = "#/";
    });

    $("#btn-reset").addEventListener("click", () => {
      $("#f-title").value = ""; $("#f-summary").value = ""; $("#f-category").value = "";
      $("#f-date").value = todayISO(); $("#f-author").value = ""; $("#f-source").value = "";
      $("#f-source-url").value = ""; $("#f-cover").value = ""; $("#f-tags").value = "";
      $("#f-content").value = ""; $("#f-featured").checked = false;
      $("#json-out").textContent = "点「生成 JSON」后显示";
      $("#btn-copy-json").style.display = "none";
      update();
    });

    const load = $("#f-load");
    if (load) load.addEventListener("change", () => {
      const it = DATA.find((d) => d.id === load.value);
      if (!it) return;
      const t = parseDate(it.date);
      const p = (n) => String(n).padStart(2, "0");
      $("#f-title").value = it.title || "";
      $("#f-summary").value = it.summary || "";
      $("#f-category").value = it.category || "";
      $("#f-date").value = t ? t.getFullYear() + "-" + p(t.getMonth() + 1) + "-" + p(t.getDate()) + "T" + p(t.getHours()) + ":" + p(t.getMinutes()) : "";
      $("#f-author").value = it.author || "";
      $("#f-source").value = it.source || "";
      $("#f-source-url").value = it.sourceUrl || "";
      $("#f-cover").value = it.cover || "";
      $("#f-tags").value = (it.tags || []).join(", ");
      $("#f-content").value = it.content || "";
      $("#f-featured").checked = !!it.featured;
      update();
    });

    $$("[data-del]").forEach((btn) => btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-del");
      writeLocal(readLocal().filter((d) => d.id !== id));
      DATA = buildData();
      render();
    }));

    update();
  }

  function copyText(text, btn) {
    const done = () => { const old = btn.textContent; btn.textContent = "已复制"; setTimeout(() => { btn.textContent = old; }, 1400); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallback());
    } else fallback();
    function fallback() {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { alert("复制失败，请手动选择文本"); }
      ta.remove();
    }
  }

    let h = '<div class="wrap"><div class="doc">';

    h += "<h2>七、常见错误</h2>";
    h += "<ul>" +
      "<li><strong>整页白屏</strong>：JSON 语法错（尾逗号、缺引号、中文引号）。页面会在报头下方提示错误来源。</li>" +
      "<li><strong>图片裂了</strong>：<code>cover</code> 贴成了网页地址、或图片有防盗链。换成图片直链（右键「复制图片地址」）。</li>" +
      "<li><strong>顺序不对</strong>：<code>date</code> 缺时区或格式不是 ISO，会被当成 0 排在最后。</li>" +
      "<li><strong>分类太多</strong>：分类名不一致（「AI」和「人工智能」）会拆成两个筛选项，建议统一。</li>" +
      "</ul>";

    h += "</div></div>";
    return h;
  }

  /* ---------------- 路由 ---------------- */
  function parseRoute() {
    const raw = (location.hash || "#/").replace(/^#/, "");
    const parts = raw.split("/").filter(Boolean);
    if (!parts.length) return { view: "home" };
    if (parts[0] === "n" && parts[1]) return { view: "article", id: decodeURIComponent(parts[1]) };
    if (parts[0] === "write") return { view: "write" };
    if (parts[0] === "guide") return { view: "guide" };
    if (parts[0] === "cat" && parts[1]) { UI.cat = decodeURIComponent(parts[1]); return { view: "home" }; }
    return { view: "home" };
  }

  function render() {
    const r = parseRoute();
    const view = $("#view");
    if (r.view === "article") {
      view.innerHTML = renderArticle(r.id);
      document.title = (DATA.find((d) => d.id === r.id) || {}).title ? DATA.find((d) => d.id === r.id).title + " · " + (SITE.siteName || "") : "文章 · " + (SITE.siteName || "");
    } else if (r.view === "write") {
      view.innerHTML = renderEditor();
      bindEditor();
      document.title = "投递新闻 · " + (SITE.siteName || "");
    } else if (r.view === "guide") {
      view.innerHTML = renderGuide();
      bindGuide();
      document.title = "接入说明 · " + (SITE.siteName || "");
    } else {
      view.innerHTML = renderHome();
      bindHome();
      document.title = (SITE.siteName || "每日简报") + " · " + (SITE.siteNameEn || "DAILY BRIEF");
    }
    // 导航高亮
    const key = r.view === "home" ? "home" : r.view;
    $$("#nav a").forEach((a) => {
      const isOn = a.getAttribute("data-route") === key;
      if (isOn) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    // 页脚统计
    $("#foot-stat").innerHTML = "共 " + DATA.length + " 篇 · 最后更新 " +
      (DATA[0] ? fmtDate(DATA[0].date, true) : "—") + "<br>数据源：" + (readLocal().length ? "内嵌 + 本地草稿" : "内嵌数据块");
  }

  function bindHome() {
    $$(".chip[data-cat]").forEach((b) => b.addEventListener("click", () => {
      UI.cat = b.getAttribute("data-cat");
      render();
    }));
    $$(".seg button[data-sort]").forEach((b) => b.addEventListener("click", () => {
      UI.sort = b.getAttribute("data-sort");
      render();
    }));
  }

  function bindGuide() {
    const cs = $("#copy-sample"), cp = $("#copy-prompt");
    if (cs) cs.addEventListener("click", () => copyText($("#sample-json").textContent, cs));
    if (cp) cp.addEventListener("click", () => copyText($("#prompt-text").textContent, cp));
  }

  /* ---------------- 主题 ---------------- */
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("brief.theme", t); } catch (e) { }
    const icon = $("#theme-icon");
    if (icon) icon.innerHTML = t === "dark"
      ? '<circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>'
      : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  }

  /* ---------------- 初始化 ---------------- */
  function init() {
    // 品牌与文案
    $("#brand-cn").textContent = SITE.siteName || "每日简报";
    $("#brand-en").textContent = SITE.siteNameEn || "DAILY BRIEF";
    $("#foot-brand").textContent = (SITE.siteName || "每日简报") + " · " + (SITE.siteNameEn || "DAILY BRIEF");

    // 主题
    let saved = "light";
    try { saved = localStorage.getItem("brief.theme") || "light"; } catch (e) { }
    applyTheme(saved);
    $("#theme-btn").addEventListener("click", () => {
      applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    // 搜索
    const q = $("#q");
    q.value = UI.q;
    q.addEventListener("input", () => {
      UI.q = q.value;
      const r = parseRoute();
      if (r.view !== "home") { location.hash = "#/"; }
      else render();
    });

    window.addEventListener("hashchange", () => { render(); window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" }); });

    render();
    loadRemote();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
